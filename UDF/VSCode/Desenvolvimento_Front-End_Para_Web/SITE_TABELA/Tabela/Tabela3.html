<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form>

        <h2>Login</h2>
        Login:<br>
        <input type="email" name="login"><br>

        Senha:<br>
        <input type="password" name="senha"><br>
        <input type="submit" value="Logar"><br><br>

        <h2>Cadastre-se</h2>
        Sexo:<br>
        <input type="radio" name="sexo" value="M">Masculino
        <input type="radio" name="sexo" value="F">Feminino<br><br>


        Interreses: <br>
        <input type="checkbox" name="interesses">Futebol<br>
        <input type="checkbox" name="interesses">Cursos<br>
        <input type="checkbox" name="interesses">Moda<br><br>


        Estado:<br>
        <select name="estado">
            <option value="df">DF</option>
            <option value="go">GO</option>
            <option value="sp">SP</option>
            <option value="rj">RJ</option>
            <option value="rs">RS</option>
            <option value="to">TO</option>
        </select><br><br>

        
            Observações: <br>
            <textarea name="obs"></textarea><br>
            <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
