<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Site</title>
</head>
<body>
    
    <form>
        <h1>Meu Site</h1><br>
        
        <p>Nome Completo: <input type="text" name="nome" placeholder="Seu Nome Completo"></p>
        
        <p>E-mail: <input type="email" name="email" placeholder="exemple@dominio.com"></p>

        <p>Senha: <input type="password" name="senha"></p>

        <p>Idade: <input type="number" name="idade"></p>

        <p>Data de Nascimento: <input type="date" name="data" placeholder="dd/mm/aaaa"></p>

        <p>Site pessoal: <input type="url" name="site"></p>

       <p>Cor favorita: <input type="color" name="cor"></p>

       <p>Aceito os termos: <input type="checkbox" name="checkbox"></p>

      <p>Gênero: 
        <input type="radio" name="genero" value="M"> Masculino
        <input type="radio" name="genero" value="F"> Feminino
        <input type="radio" name="genero" value="X"> Outro
     </p>

        <p>Comentários: <textarea name="obs" rows="5" cols="40"></textarea></p>

       <button type="submit" value="Enviar">Enviar</button>
    </form>
</body>
</html>
